<style>
@font-face{font-family:FD;src:url(../../app/src/main/res/font/funnel_display.ttf)}

html,body{margin:0;width:1280px;height:640px;overflow:hidden;background:#050506}
body{position:relative;font-family:FS;color:#fff;
 background:radial-gradient(700px 520px at 0% 100%,rgba(150,40,30,.35),transparent 70%),

.logo{position:absolute;left:86px;top:96px;height:68px}
h1{position:absolute;left:96px;top:208px;margin:0;font-family:FD;font-weight:400;font-size:52px;line-height:60px;white-space:nowrap;letter-spacing:-.5px;width:560px}
.sub{position:absolute;left:96px;top:398px;font-size:24px;line-height:36px;color:rgba(255,255,255,.62)}
.chips{position:absolute;left:96px;top:488px;display:flex;gap:12px}
.chip{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:19px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font-size:19px}

<div class="chips">
 <div class="chip"><span class="dot" style="background:#5eead4"></span>No cloud</div>
 <div class="chip"><span class="dot" style="background:#93a5ff"></span>No trackers</div>
 <div class="chip"><span class="dot" style="background:#fcd34d"></span>MIT / Apache-2.0</div>
</div>
<div class="phone back"><img src="../screenshots/heart-rate.png"></div>
