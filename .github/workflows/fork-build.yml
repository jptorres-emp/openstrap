# The fork's own build: the tests and a release APK (R8, lighter than debug) on every push to main. The log, any failing tests' reports and the
# APK go to the ci-results branch (readable with git alone), and the APK to the "latest" pre-release, for a phone to
# download straight from the fork's Releases.
name: Fork build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fork-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;36.0.0" > /dev/null

      - name: Test and build
        id: build
        run: |
          set -o pipefail
          { ./gradlew :protocol:test :app:testDebugUnitTest --continue && ./gradlew :app:assembleRelease; } 2>&1 | tee build.log

      - name: Publish results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.build.outcome }}
        run: |
          mkdir -p out/tests
          cp build.log out/ 2>/dev/null || true
          grep -rl "<failure" --include="*.xml" . 2>/dev/null | grep test-results | xargs -r -I{} cp {} out/tests/ || true
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then cp app/build/outputs/apk/release/app-release.apk out/OpenStrap.apk; fi
          echo "$OUTCOME ${{ github.sha }}" > out/STATUS
          cd out
          git init -q -b ci-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Build of ${{ github.sha }}: $OUTCOME"
          git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-results
          cd ..
          if [ -f out/OpenStrap.apk ]; then
            gh release delete latest --yes --cleanup-tag 2>/dev/null || true
            gh release create latest out/OpenStrap.apk --prerelease --target "${{ github.sha }}" \
              --title "OpenStrap with reports (fork build)" --notes "Release build (R8) of ${{ github.sha }}, signed with this fork's own key."
          fi
