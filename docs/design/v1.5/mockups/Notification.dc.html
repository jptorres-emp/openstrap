<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workout notification</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@700&amp;family=Outfit:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
.ph{width:390px;height:520px;box-sizing:border-box;padding:28px 14px;font-family:Outfit,system-ui,sans-serif;color:#fff;background:linear-gradient(180deg,#1a1a22 0%,#0b0b10 100%);display:flex;flex-direction:column;gap:14px}
.clock{text-align:center;font-size:64px;font-weight:300;letter-spacing:-.02em;margin:8px 0 14px}
.n{background:#000000d9;border:1px solid #ffffff14;border-radius:24px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.hd{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#ffffffa6}
.ic{width:20px;height:20px;border-radius:6px;background:#ff5a5f;display:flex;align-items:center;justify-content:center}
.row{display:flex;align-items:flex-end;justify-content:space-between}
.dots{font-family:Doto,monospace;font-weight:700;line-height:.85}
.sm{font-size:12.5px;color:#ffffffb3}
.strip{display:flex;gap:3px}
.strip i{flex:1;height:5px;border-radius:3px;background:#ffffff1f;display:block}
.acts{display:flex;gap:8px}
.acts button{flex:1;background:#ffffff1a;border:0;border-radius:14px;color:#fff;font-family:inherit;font-size:14px;padding:10px 0}
.cap{font-size:12.5px;color:#ffffff73;text-align:center}
.pill{align-self:center;display:flex;align-items:center;gap:8px;background:#000;border-radius:999px;padding:8px 14px;border:1px solid #ffffff14;font-size:14px}
.pill .d{width:8px;height:8px;border-radius:50%;background:#ffd166;box-shadow:0 0 8px #ffd166}
</style>
</helmet>
<div class="ph">
  <div class="clock">17:28</div>
  <div class="n">
    <div class="hd"><span class="ic"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg></span>OpenStrap<span style="margin-left:auto">now</span></div>
    <div class="row">
      <div><div class="sm">Run, 18:42</div><div style="font-size:15px;margin-top:4px">3.10 km, 5:58 a km</div></div>
      <div style="display:flex;align-items:flex-end;gap:6px"><span class="dots" style="font-size:40px;color:#ffd166">152</span><span class="sm">bpm</span></div>
    </div>
    <div class="strip"><i></i><i></i><i style="background:#ffd166;box-shadow:0 0 8px #ffd16699"></i><i></i><i></i></div>
    <div class="acts"><button>Pause</button><button>Lap</button></div>
  </div>
  <div class="cap">Expanded. Three numbers at most, the zone strip is the arc laid flat.</div>
  <div class="pill"><span class="d"></span>Run 18:42<span class="dots" style="font-size:20px;color:#ffd166">152</span></div>
  <div class="cap">Collapsed</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":520}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
