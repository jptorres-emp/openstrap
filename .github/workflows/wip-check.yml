# Work in progress on the wip branch: compile the app and run its unit tests, without building or publishing an APK.
# The log, any failing tests' reports and Room's schemas go to the ci-results-wip branch, readable with git alone.
name: WIP check

on:
  push:
    branches: [wip]

concurrency:
  group: wip-check
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Compile and test
        id: build
        run: |
          set -o pipefail
          ./gradlew :app:compileDebugKotlin :app:compileDebugUnitTestKotlin 2>&1 | tee build.log
          OPENSTRAP_SHOTS=1 ./gradlew :protocol:test :app:testDebugUnitTest --continue 2>&1 | tee -a build.log

      # The original's lint job (android.yml): Android lint and detekt, which fail on any finding not in their baselines.
      - name: Lint and static analysis
        id: lint
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug :app:detektDebug :protocol:detektMain --continue 2>&1 | tee lint.log

      - name: Publish results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.build.outcome }}
          LINT: ${{ steps.lint.outcome }}
        run: |
          mkdir -p out/tests out/lint
          cp build.log out/ 2>/dev/null || true
          cp lint.log out/lint/ 2>/dev/null || true
          cp app/build/reports/lint-results-debug.xml out/lint/ 2>/dev/null || true
          cp app/build/reports/detekt/debug.md out/lint/detekt-app.md 2>/dev/null || true
          cp protocol/build/reports/detekt/main.md out/lint/detekt-protocol.md 2>/dev/null || true
          # Room's schemas as KSP wrote them, so a new database version's file can be committed from here.
          cp -r app/schemas out/ 2>/dev/null || true
          # Screens as ScreenshotsTest drew them.
          cp -r app/build/shots out/ 2>/dev/null || true
          grep -rl "<failure" --include="*.xml" . 2>/dev/null | grep test-results | xargs -r -I{} cp {} out/tests/ || true
          echo "$OUTCOME ${{ github.sha }} lint=$LINT" > out/STATUS
          cd out
          git init -q -b ci-results-wip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Check of ${{ github.sha }}: $OUTCOME"
          git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-results-wip
