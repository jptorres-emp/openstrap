# Keeps the fork up to date with the original (sayed0am/unstrap): every day, and on demand, the original's main and
# its release tags are merged into the fork's main. The Portuguese drops what the original removed
# (.github/scripts/pt_sync.py), and the merge is checked as the original checks itself (the tests, lint and detekt)
# before it's pushed. A clean, green merge is pushed and the fork build runs on it, which publishes a new APK. A merge
# that conflicts or fails a check is not pushed: the run fails (GitHub emails the fork's owner) and its summary says
# which files conflict or which check failed. New text from the original shows in English until it is translated;
# the summary lists it.
#
# A push made with the workflow's own token can't change files under .github/workflows. When the original changes
# one, add a token with the workflow scope as the SYNC_TOKEN secret, or merge that change by hand.
name: Upstream sync

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  UPSTREAM: sayed0am/unstrap

jobs:
  sync:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge the original's main
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/$UPSTREAM.git"
          git fetch -q --tags upstream main
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "upstream=$(git rev-parse --short upstream/main)" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "state=current" >> "$GITHUB_OUTPUT"
            echo "Up to date with $UPSTREAM $(git rev-parse --short upstream/main)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          count=$(git rev-list --count HEAD..upstream/main)
          if git merge --no-ff --no-edit -m "Merge the original's main ($(git rev-parse --short upstream/main), $count commits)" upstream/main; then
            echo "state=merged" >> "$GITHUB_OUTPUT"
            echo "Merged $count commits of $UPSTREAM, up to $(git rev-parse --short upstream/main)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "state=conflict" >> "$GITHUB_OUTPUT"
            {
              echo "### The merge of $count commits of $UPSTREAM conflicts, so nothing was pushed"
              echo
              git diff --name-only --diff-filter=U | sed 's/^/- /'
              echo
              echo "Merge upstream/main by hand, resolve these files, and push to main."
            } >> "$GITHUB_STEP_SUMMARY"
            git merge --abort
          fi

      - name: Keep the Portuguese in step
        if: steps.merge.outputs.state == 'merged'
        run: |
          python3 .github/scripts/pt_sync.py app/src/main/res "${{ steps.merge.outputs.base }}" >> "$GITHUB_STEP_SUMMARY"
          if ! git diff --quiet; then
            git commit -qam "Drop the Portuguese for the text the original removed"
          fi

      - uses: ./.github/actions/setup
        if: steps.merge.outputs.state == 'merged'

      - name: Check the merge
        id: check
        if: steps.merge.outputs.state == 'merged'
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :protocol:test :app:testDebugUnitTest :app:lintDebug :app:detektDebug :protocol:detektMain --continue 2>&1 | tee check.log

      - name: Push and build
        id: push
        if: steps.merge.outputs.state == 'merged' && steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          git push -q origin HEAD:main
          git push -q origin 'refs/tags/v*:refs/tags/v*' || true
          # A push with the workflow's own token starts no workflow, so the fork build is started here.
          if [ -z "$SYNC_TOKEN" ]; then gh workflow run fork-build.yml --ref main; fi
          echo "Pushed to main, and the fork build started." >> "$GITHUB_STEP_SUMMARY"

      - name: Say what stopped it
        if: steps.merge.outputs.state == 'conflict' || steps.check.outcome == 'failure' || failure()
        env:
          CHECK: ${{ steps.check.outcome }}
          PUSH: ${{ steps.push.outcome }}
        run: |
          if [ "$PUSH" = "failure" ]; then
            echo "### The push failed: if the merge changes a workflow, add the SYNC_TOKEN secret or push it by hand" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$CHECK" = "failure" ]; then
            {
              echo "### The merge failed a check, so nothing was pushed"
              echo
              echo '```'
              grep -E "^> Task .* FAILED|FAILED$|^e: |What went wrong" -A3 check.log | head -80
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 1
