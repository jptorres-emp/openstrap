<style>
body{margin:0;background:#000}
.ph{width:390px;background:#000;color:#fff;font-family:Outfit,system-ui,sans-serif;position:relative;overflow:hidden;box-sizing:border-box;padding:12px 16px 0}
.feed{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:12px}
.dots{font-family:Doto,monospace;font-weight:700;line-height:.85;letter-spacing:.01em}
.g{position:relative;overflow:hidden;isolation:isolate;border-radius:36px;box-sizing:border-box;padding:18px 20px;display:flex;flex-direction:column;background:linear-gradient(var(--a,180deg),var(--l) 0%,var(--m) 42%,var(--m) 100%);box-shadow:inset var(--x,0px) var(--y,24px) 38px -14px var(--l),inset 0 0 22px 1px #ffffff10,inset 0 0 0 1px #ffffff16,inset 0 1px 0 #ffffff24}

.g.hot{box-shadow:inset var(--x,0px) var(--y,24px) 44px -8px var(--l),inset 0 0 30px 4px var(--l),inset 0 0 0 1.5px #ffffff38,inset 0 1px 0 #ffffff30}

.in{position:relative;z-index:1;display:flex;flex-direction:column;height:100%}
.S{width:173px;height:160px;padding:16px}

.L{width:358px;height:380px;padding:22px}
.slp{--l:hsl(229 88% 64%);--m:hsl(230 72% 20%);--c:hsl(232 80% 3%);--t:hsl(242 60% 13%)}
.sky{--l:hsl(252 80% 66%);--m:hsl(236 70% 9%);--c:hsl(236 80% 2%);--t:hsl(246 60% 8%)}
.hrt{--l:hsl(358 92% 64%);--m:hsl(354 72% 20%);--c:hsl(356 70% 3%);--t:hsl(343 60% 14%)}
.hrv{--l:hsl(173 70% 50%);--m:hsl(176 64% 13%);--c:hsl(176 80% 3%);--t:hsl(188 55% 10%)}
.o2{--l:hsl(199 90% 60%);--m:hsl(201 74% 17%);--c:hsl(203 80% 3%);--t:hsl(214 60% 12%)}
.brt{--l:hsl(226 90% 74%);--m:hsl(226 58% 19%);--c:hsl(228 70% 3%);--t:hsl(240 50% 13%)}

.word{font-weight:500;color:#fff;text-shadow:0 0 14px var(--l)}
.sent{font-size:22px;line-height:1.22;font-weight:400;letter-spacing:-.01em;margin:0}
.soft{color:#ffffff73}
.sp{flex:1}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hdr{display:flex;align-items:center;justify-content:space-between;height:60px;margin-bottom:8px}
.av{width:38px;height:38px;border-radius:50%;background:#1c1c1e;display:flex;align-items:center;justify-content:center;border:0;color:#fff;padding:0}
.day{display:flex;align-items:center;gap:16px}
.peek{font-size:15px;color:#ffffff38}
.mom{display:flex;flex-direction:column;align-items:center;gap:1px}
.mom b{font-size:12.5px;font-weight:500;color:#ffffff8f}
.mom span{font-size:17px;font-weight:500}
.chip{display:flex;align-items:center;gap:7px;background:#16161a;border:1px solid #ffffff12;border-radius:999px;padding:8px 12px;font-size:13px;color:#fff;font-family:inherit}
.dot{width:7px;height:7px;border-radius:50%;background:#3ddc97}
.bar{position:absolute;left:16px;right:16px;bottom:22px;display:flex;gap:10px;align-items:center;z-index:5}
.tabs{flex:1;display:flex;background:#121214f2;border:1px solid #ffffff14;border-radius:999px;padding:6px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;border-radius:999px;font-size:11px;color:#ffffff8c;border:0;background:none;font-family:inherit}
.tab.on{background:var(--tint,#ffffff1f);color:#fff}
.act{width:58px;height:58px;border-radius:50%;border:1px solid #ffffff1a;background:#121214;display:flex;align-items:center;justify-content:center;color:#fff;padding:0}
.wk{display:flex;align-items:flex-end;gap:8px;height:56px;margin-top:12px}
.wk span{flex:1;border-radius:6px;background:#ffffff30}
.q{position:relative;isolation:isolate;border-radius:28px;box-sizing:border-box;padding:18px 20px;display:flex;flex-direction:column;background:#000}
.q::before{content:"";position:absolute;inset:0;border-radius:inherit;border:2px dotted #ffffff4a;pointer-events:none}
.q.off::before{border-color:var(--l)}
.q.off .word{color:var(--l);text-shadow:none;background:none;padding-left:0}
.q>.core{display:none}
.q.S{padding:16px}
.q.St{padding:0 20px;border-radius:24px}
.q{background:#0a0a0b;box-shadow:inset 0 -2px 0 var(--l),inset 0 -30px 32px -28px var(--l),inset 0 0 0 1px #ffffff10}
.q::before{display:none}
.q.off{box-shadow:inset 0 -3px 0 var(--l),inset 0 -48px 44px -26px var(--l),inset 0 0 0 1.5px color-mix(in srgb,var(--l) 55%,transparent)}
.q.neu{box-shadow:inset 0 0 0 1px #ffffff14}
.qp{box-shadow:inset 0 -2px 0 #ffffff38,inset 0 -26px 30px -26px #ffffff40}
.q.et{box-shadow:inset 0 2px 0 var(--l),inset 0 30px 32px -28px var(--l),inset 0 0 0 1px #ffffff10}
.q.er{box-shadow:inset -2px 0 0 var(--l),inset -30px 0 32px -28px var(--l),inset 0 0 0 1px #ffffff10}
.q.el{box-shadow:inset 2px 0 0 var(--l),inset 30px 0 32px -28px var(--l),inset 0 0 0 1px #ffffff10}
.q.off.et{box-shadow:inset 0 3px 0 var(--l),inset 0 48px 44px -26px var(--l),inset 0 0 0 1.5px color-mix(in srgb,var(--l) 55%,transparent)}
.q.prog{box-shadow:inset 0 0 0 1px #ffffff10}
.q.prog::before{display:block;content:"";position:absolute;inset:auto auto 0 0;height:2px;width:var(--p);border:0;border-radius:2px;background:var(--l);box-shadow:0 -8px 24px 1px var(--l)}
.q{border:1px solid #ffffff12;border-bottom:2px solid var(--l);box-shadow:inset 0 -30px 32px -28px var(--l)}
.q.et{border-bottom:1px solid #ffffff12;border-top:2px solid var(--l);box-shadow:inset 0 30px 32px -28px var(--l)}
.q.er{border-bottom:1px solid #ffffff12;border-right:2px solid var(--l);box-shadow:inset -30px 0 32px -28px var(--l)}
.q.el{border-bottom:1px solid #ffffff12;border-left:2px solid var(--l);box-shadow:inset 30px 0 32px -28px var(--l)}
.q.off{border-color:color-mix(in srgb,var(--l) 55%,transparent);border-bottom:3px solid var(--l);box-shadow:inset 0 -48px 44px -26px var(--l)}
.q.off.et{border-bottom:1.5px solid color-mix(in srgb,var(--l) 55%,transparent);border-top:3px solid var(--l);box-shadow:inset 0 48px 44px -26px var(--l)}
.q.neu{border:1px solid #ffffff14;box-shadow:none}
.q.prog{border:1px solid #ffffff12;box-shadow:none}
.q.prog::before{display:block;content:"";position:absolute;inset:-1px;width:auto;height:auto;border-radius:inherit;border:0;border-bottom:2px solid var(--l);background:none;box-shadow:inset 0 -26px 28px -24px var(--l);-webkit-mask-image:linear-gradient(90deg,#000 var(--p),transparent calc(var(--p) + 5%));mask-image:linear-gradient(90deg,#000 var(--p),transparent calc(var(--p) + 5%))}
.q{border:1px solid #ffffff12;box-shadow:inset 0 -34px 34px -26px var(--l)}
.q.et{border:1px solid #ffffff12;box-shadow:inset 0 34px 34px -26px var(--l)}
.q.er{border:1px solid #ffffff12;box-shadow:inset -34px 0 34px -26px var(--l)}
.q.el{border:1px solid #ffffff12;box-shadow:inset 34px 0 34px -26px var(--l)}
.q.off{border:1px solid color-mix(in srgb,var(--l) 45%,transparent);box-shadow:inset 0 -52px 46px -24px var(--l)}
.q.off.et{border:1px solid color-mix(in srgb,var(--l) 45%,transparent);box-shadow:inset 0 52px 46px -24px var(--l)}
.q.neu{border:1px solid #ffffff14;box-shadow:none}
.q.prog{border:1px solid #ffffff12;box-shadow:none}
.q.prog::before{border-bottom:0;box-shadow:inset 0 -34px 34px -26px var(--l)}
.list{background:#0f0f11;border-radius:28px;padding:6px 18px 8px;width:358px;box-sizing:border-box;border:1px solid #ffffff0f}
.lh{display:flex;justify-content:space-between;align-items:center;padding:12px 0 8px}
.lr{display:flex;align-items:center;gap:12px;padding:13px 0;border:0;border-top:1px solid #ffffff0d;background:none;width:100%;color:#fff;font-family:inherit;text-align:left}
.lr i{width:8px;height:8px;border-radius:50%;flex:none}
.lr .n{flex:1;font-size:15px}
.lr .v{font-family:Doto,monospace;font-weight:700;font-size:22px;line-height:1}
.lr .s{width:124px;text-align:right;font-size:12.5px;color:#ffffff99}
.list.wait{opacity:.6}
.q{box-shadow:inset 0 -30px 34px -28px color-mix(in srgb,var(--l) 50%,transparent)}
.q.et{box-shadow:inset 0 30px 34px -28px color-mix(in srgb,var(--l) 50%,transparent)}
.q.er{box-shadow:inset -30px 0 34px -28px color-mix(in srgb,var(--l) 50%,transparent)}
.q.el{box-shadow:inset 30px 0 34px -28px color-mix(in srgb,var(--l) 50%,transparent)}
.q.off{box-shadow:inset 0 -44px 42px -26px color-mix(in srgb,var(--l) 75%,transparent)}
.q.off.et{box-shadow:inset 0 44px 42px -26px color-mix(in srgb,var(--l) 75%,transparent)}
.q.neu{box-shadow:none}
.q.prog{box-shadow:inset 0 -30px 34px -28px color-mix(in srgb,var(--l) 50%,transparent)}
.q.prog::before{display:none}
.pbar{height:4px;border-radius:2px;background:#ffffff14;margin-top:12px;overflow:hidden;flex:none}
.pbar i{display:block;height:100%;width:var(--p);background:var(--l);border-radius:2px}
.g.second{background:linear-gradient(var(--a,180deg),color-mix(in srgb,var(--l) 45%,var(--m)) 0%,var(--m) 38%,var(--m) 100%);box-shadow:inset var(--x,0px) var(--y,24px) 26px -18px color-mix(in srgb,var(--l) 60%,transparent),inset 0 0 0 1px #ffffff16}
.lr .v{width:70px;text-align:right}
.lr .s{width:118px}
.circ{width:30px;height:30px;font-size:13px}
.ci{white-space:nowrap;font-size:14.5px}
.lr{display:grid;grid-template-columns:8px 1fr auto;grid-template-areas:"d n v" "d s v";column-gap:12px;row-gap:3px;align-items:center}
.lr i{grid-area:d}
.lr .n{grid-area:n}
.lr .s{grid-area:s;width:auto;text-align:left}
.lr .v{grid-area:v;width:auto;text-align:right;font-size:24px}
</style>
</helmet>
<div class="ph" style="height:1432px">

            <line x1="6" y1="66" x2="30" y2="66" stroke="#8fa8ff"/><line x1="40" y1="94" x2="70" y2="94" stroke="#4c6fff"/><line x1="80" y1="66" x2="104" y2="66" stroke="#8fa8ff"/><line x1="112" y1="38" x2="128" y2="38" stroke="#b37cff"/><line x1="136" y1="10" x2="140" y2="10" stroke="#ffb547"/><line x1="148" y1="94" x2="176" y2="94" stroke="#4c6fff"/><line x1="186" y1="66" x2="214" y2="66" stroke="#8fa8ff"/><line x1="222" y1="38" x2="250" y2="38" stroke="#b37cff"/><line x1="258" y1="66" x2="286" y2="66" stroke="#8fa8ff"/><line x1="294" y1="38" x2="308" y2="38" stroke="#b37cff"/>
          </g>
        </svg>
        <div style="display:flex;justify-content:space-between;margin-top:6px"><span class="sm">Deep 1 h 30</span><span class="sm">REM 1 h 50</span><span class="sm">Light 4 h 20</span></div>
      </div>
    </div>
    <div class="list"><div class="lh"><span class="lbl">Night vitals</span><span class="sm">Against your normal</span></div><button class="lr"><i style="background:#ff5a5f"></i><span class="n">Lowest heart rate</span><span class="v">48</span><span class="s">At 04:10, usual</span></button><button class="lr"><i style="background:#2dd4bf"></i><span class="n">HRV</span><span class="v" style="color:#2dd4bf">41</span><span class="s" style="color:#2dd4bf">Below your normal</span></button><button class="lr"><i style="background:#8fa8ff"></i><span class="n">Breathing rate</span><span class="v">13.8</span><span class="s">Usual</span></button><button class="lr"><i style="background:#38bdf8"></i><span class="n">Blood oxygen</span><span class="v">96%</span><span class="s">Usual</span></button><button class="lr"><i style="background:#ff8a3d"></i><span class="n">Skin temperature</span><span class="v">+0.1</span><span class="s">Usual</span></button><button class="lr"><i style="background:#ff5a5f"></i><span class="n">Average heart rate</span><span class="v">55</span><span class="s">Usual</span></button></div>
    <div class="q W slp et" style="--a:90deg;--x:22px;--y:0px;height:200px">

      <div class="in">
