# The fork's own build: the tests and a release APK (R8) on every push to main, signed with the fork's key
# (app/debug.keystore) so each build installs over the one before and keeps the phone's data. The log, any failing
# tests' reports and the APK go to the ci-results branch (readable with git alone), and the APK to the "latest"
# pre-release, for a phone to download straight from the fork's Releases.
name: Fork build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fork-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      # The whole history, for the tags.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      # The original's last release in this history, and the fork's own build of it (3.1.0-fork installs as 30100). Its
      # tags are read from the original, as a fork doesn't get the ones made after it was forked.
      - name: Version
        run: |
          git fetch -q --tags https://github.com/sayed0am/unstrap.git
          v=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-fork') || { echo "No release of the original in the history: run the upstream sync, which brings its tags" >&2; exit 1; }
          echo "FORK_VERSION=${v#v}-fork" >> "$GITHUB_ENV"

      - name: Test and build
        id: build
        run: |
          set -o pipefail
          { ./gradlew :protocol:test :app:testDebugUnitTest --continue && ./gradlew :app:assembleRelease -PappVersion=$FORK_VERSION; } 2>&1 | tee build.log

      - name: Publish results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.build.outcome }}
        run: |
          mkdir -p out/tests
          cp build.log out/ 2>/dev/null || true
          grep -rl "<failure" --include="*.xml" . 2>/dev/null | grep test-results | xargs -r -I{} cp {} out/tests/ || true
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then cp app/build/outputs/apk/release/app-release.apk out/OpenStrap.apk; fi
          echo "$OUTCOME ${{ github.sha }}" > out/STATUS
          cd out
          git init -q -b ci-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Build of ${{ github.sha }}: $OUTCOME"
          git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-results
          cd ..
          # The first build of each of the original's releases is a release of its own too, v3.1.0-fork: the app's
          # updater reads this fork's releases (update/Releases.kt), so a phone on an older one is offered it.
          if [ -f out/OpenStrap.apk ] && ! gh release view "v$FORK_VERSION" > /dev/null 2>&1; then
            gh release create "v$FORK_VERSION" out/OpenStrap.apk --target "${{ github.sha }}" --title "OpenStrap $FORK_VERSION" \
              --notes "The original's ${FORK_VERSION%-fork} with the fork's changes (Portuguese, the weight log, the reports with their Training view, the journal, the week's report on Today, and the whole track of workouts started in Zepp's app), signed with this fork's own key."
          fi
          if [ -f out/OpenStrap.apk ]; then
            gh release delete latest --yes --cleanup-tag 2>/dev/null || true
            gh release create latest out/OpenStrap.apk --prerelease --target "${{ github.sha }}" \
              --title "OpenStrap $FORK_VERSION (fork build)" --notes "Release build (R8) of ${{ github.sha }}, the original's ${FORK_VERSION%-fork} with the fork's changes, signed with this fork's own key."
          fi
