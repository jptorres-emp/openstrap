<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Info sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@700&amp;family=Outfit:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
.ph{width:390px;height:844px;background:#000;color:#fff;font-family:Outfit,system-ui,sans-serif;position:relative;overflow:hidden}
.behind{position:absolute;inset:0;background:linear-gradient(180deg,hsl(176 64% 13%) 0%,#000 40%);opacity:.4}
.sheet{position:absolute;left:0;right:0;bottom:0;top:180px;background:#0b0b0d;border-radius:32px 32px 0 0;border-top:1px solid #ffffff1c;padding:10px 22px 0;box-sizing:border-box;display:flex;flex-direction:column}
.sheet::before{content:"";position:absolute;left:10%;right:10%;top:-30px;height:60px;background:hsl(173 70% 50%);filter:blur(40px);opacity:.35;z-index:-1}
.grab{width:40px;height:5px;border-radius:3px;background:#ffffff33;align-self:center;margin-bottom:18px}
.k{font-size:13px;color:#ffffff80}
h1{font-size:23px;line-height:1.28;font-weight:500;margin:6px 0 0}
.sc{display:flex;gap:6px;margin-top:22px}
.sc div{flex:1;display:flex;flex-direction:column;gap:8px}
.sc i{display:block;height:10px;border-radius:5px}
.sc span{font-size:12.5px;color:#ffffffb8}
.you{font-size:12.5px;color:#fff;margin-top:10px}
.grp{background:#141416;border:1px solid #ffffff10;border-radius:24px;padding:2px 18px;margin-top:24px}
.r{display:flex;align-items:center;gap:12px;padding:16px 0;border:0;border-bottom:1px solid #ffffff0d;background:none;width:100%;color:#fff;font-family:inherit;text-align:left;font-size:15.5px}
.r:last-child{border-bottom:0}
.r svg{margin-left:auto;opacity:.6}
</style>
</helmet>
<div class="ph">
  <div class="behind"></div>
  <div class="sheet">
    <div class="grab"></div>
    <span class="k">HRV</span>
    <h1>The small changes in time between heartbeats. Higher usually means your body is more rested.</h1>
    <div class="sc">
      <div><i style="background:hsl(173 70% 50%);box-shadow:0 0 14px hsl(173 70% 50%)"></i><span>Below your normal</span></div>
      <div><i style="background:#ffffff40"></i><span>Usual</span></div>
      <div><i style="background:hsl(173 70% 50% / .55)"></i><span>Above your normal</span></div>
    </div>
    <div class="you">You are here. Your normal is 44 to 58 ms, from 30 nights.</div>
    <div class="grp">
      <button class="r">How it's worked out<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
      <button class="r">What moves it<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
      <button class="r">Why it might be off<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
