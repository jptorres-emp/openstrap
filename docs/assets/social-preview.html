<!doctype html><html><head><meta charset="utf-8">

<style>
@font-face{font-family:FD;src:url(../../app/src/main/res/font/funnel_display.ttf)}
@font-face{font-family:FS;src:url(../../app/src/main/res/font/funnel_sans.ttf)}
html,body{margin:0;width:1280px;height:640px;overflow:hidden;background:#050506}
body{position:relative;font-family:FS;color:#fff;
 background:radial-gradient(700px 520px at 0% 100%,rgba(150,40,30,.35),transparent 70%),
            radial-gradient(600px 500px at 100% 0%,rgba(20,120,90,.30),transparent 70%),#050506}
.logo{position:absolute;left:86px;top:96px;height:68px}
h1{position:absolute;left:96px;top:208px;margin:0;font-family:FD;font-weight:400;font-size:52px;line-height:60px;white-space:nowrap;letter-spacing:-.5px;width:560px}
.sub{position:absolute;left:96px;top:398px;font-size:24px;line-height:36px;color:rgba(255,255,255,.62)}
.chips{position:absolute;left:96px;top:488px;display:flex;gap:12px}
.chip{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:19px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font-size:19px}
.dot{width:7px;height:7px;border-radius:50%}
.phone{position:absolute;width:290px;height:628px;border-radius:50px;padding:8px;box-sizing:border-box;
 background:linear-gradient(145deg,#4a4a50 0%,#1c1c1f 22%,#101012 60%,#3a3a40 100%);
 box-shadow:0 40px 90px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.06),inset 0 0 0 1px rgba(255,255,255,.10)}
.phone::before,.phone::after{content:"";position:absolute;right:-3px;width:3px;border-radius:0 2px 2px 0;background:linear-gradient(#55555b,#2a2a2e)}
.phone::before{top:120px;height:58px}
.phone::after{top:196px;height:92px}
.screen{position:relative;width:100%;height:100%;border-radius:42px;overflow:hidden;background:#000}
.status{height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 24px 0 28px;font:600 12.5px FS;color:#fff}
.icons{display:flex;gap:5px;align-items:center}
.bars{display:flex;gap:1.5px;align-items:flex-end;height:10px}.bars i{width:2.5px;background:#fff;border-radius:1px}
.batt{width:20px;height:10px;border:1.3px solid rgba(255,255,255,.55);border-radius:3px;padding:1px;box-sizing:border-box}.batt i{display:block;height:100%;width:78%;background:#fff;border-radius:1px}
.cam{position:absolute;top:10px;left:50%;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:#050505;box-shadow:0 0 0 1.5px #151517}
.screen img{width:100%;display:block}
.back{left:722px;top:132px;transform:rotate(-4deg);opacity:.95}
.front{left:912px;top:78px}
</style></head><body>
<img class="logo" src="logo-dark.png">
<h1>The open-source app<br>for the Amazfit<br>Helio Strap</h1>
<div class="sub">A private Zepp alternative for Android.<br>Your health data stays on your phone.</div>
<div class="chips">
 <div class="chip"><span class="dot" style="background:#5eead4"></span>No cloud</div>
 <div class="chip"><span class="dot" style="background:#93a5ff"></span>No trackers</div>
 <div class="chip"><span class="dot" style="background:#fcd34d"></span>MIT / Apache-2.0</div>
</div>
<div class="phone back"><div class="screen"><div class="status"><span>9:41</span><span class="icons"><span class="bars"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:10px"></i></span><span class="batt"><i></i></span></span></div><div class="cam"></div><img src="../screenshots/evening.png"></div></div>
<div class="phone front"><div class="screen"><div class="status"><span>9:41</span><span class="icons"><span class="bars"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:10px"></i></span><span class="batt"><i></i></span></span></div><div class="cam"></div><img src="../screenshots/today.png"></div></div>
</body></html>
