<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Strap page</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@700&amp;family=Outfit:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
.ph{width:390px;background:#000;color:#fff;font-family:Outfit,system-ui,sans-serif;position:relative;overflow:hidden;box-sizing:border-box;padding:12px 16px 0}
.feed{display:flex;flex-direction:column;gap:12px}
.dots{font-family:Doto,monospace;font-weight:700;line-height:.85;letter-spacing:.01em}
.g{position:relative;overflow:hidden;isolation:isolate;border-radius:36px;box-sizing:border-box;padding:18px 20px;display:flex;flex-direction:column;background:linear-gradient(var(--a,180deg),var(--l) 0%,var(--m) 42%,var(--m) 100%);box-shadow:inset var(--x,0px) var(--y,24px) 38px -14px var(--l),inset 0 0 22px 1px #ffffff10,inset 0 0 0 1px #ffffff16,inset 0 1px 0 #ffffff24}
.g::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;opacity:.5;background-image:radial-gradient(#ffffff0c 1px,transparent 1.2px);background-size:3px 3px}
.core{position:absolute;z-index:0;border-radius:50%;background:var(--c);filter:blur(26px);box-shadow:0 0 0 14px var(--t)}
.in{position:relative;z-index:1;display:flex;flex-direction:column;height:100%}
.L{width:358px;height:300px;padding:22px}
.neu{--l:hsl(160 30% 55%);--m:hsl(200 10% 10%);--c:hsl(200 10% 2%);--t:hsl(200 8% 7%)}
.lbl{font-size:15px;font-weight:500;color:#fffffff0}
.sm{font-size:12.5px;color:#ffffffb8;line-height:1.35}
.sp{flex:1}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav{display:flex;align-items:center;gap:8px;height:60px;margin-bottom:8px}
.back{width:38px;height:38px;border-radius:50%;background:#1c1c1e;border:0;color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.nav h1{font-size:20px;font-weight:500;margin:0}
.bar{position:absolute;left:16px;right:16px;bottom:22px;display:flex;gap:10px;align-items:center;z-index:5}
.tabs{flex:1;display:flex;background:#121214f2;border:1px solid #ffffff14;border-radius:999px;padding:6px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;border-radius:999px;font-size:11px;color:#ffffff8c;border:0;background:none;font-family:inherit}
.tab.on{background:var(--tint,#ffffff1f);color:#fff}
.act{width:58px;height:58px;border-radius:50%;border:1px solid #ffffff1a;background:#121214;display:flex;align-items:center;justify-content:center;color:#fff;padding:0}
.btns{display:flex;gap:12px}
.btn{flex:1;height:56px;border-radius:20px;border:1px solid #ffffff14;background:#121214;color:#fff;font-family:inherit;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.grp{background:#0d0d0f;border:1px solid #ffffff12;border-radius:28px;padding:4px 18px;box-sizing:border-box;width:358px}
.r{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #ffffff0d;background:none;border-left:0;border-right:0;border-top:0;width:100%;color:#fff;font-family:inherit;text-align:left}
.r:last-child{border-bottom:0}
.r .k{flex:1;font-size:15px}
.r .v{font-size:13.5px;color:#ffffff99}
.strap{position:absolute;right:22px;top:58px;width:120px;height:150px}
</style>
</helmet>
<div class="ph" style="height:1230px">
  <div class="nav">
    <button class="back" aria-label="Back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
    <h1>Your strap</h1>
  </div>
  <div class="feed">
    <div class="g L neu" style="--a:0deg;--y:-28px">
      <div class="core" style="left:-30%;top:-30%;width:120%;height:110%"></div>
      <div class="in">
        <span class="lbl">Helio Strap</span>
        <span class="sm" style="margin-top:4px">Connected. Synced 2 min ago</span>
        <svg class="strap" viewBox="0 0 120 150" aria-hidden="true"><rect x="30" y="0" width="60" height="150" rx="26" fill="#0b0b0c" stroke="#ffffff22"/><rect x="22" y="44" width="76" height="62" rx="20" fill="#18181b" stroke="#7de0c066" stroke-width="1.5"/><circle cx="60" cy="75" r="5" fill="#7de0c0"/><circle cx="60" cy="75" r="14" fill="#7de0c0" fill-opacity=".15"/></svg>
        <div class="sp"></div>
        <div style="display:flex;align-items:flex-end;gap:8px"><span class="dots" style="font-size:56px">86</span><span class="sm" style="margin-bottom:4px">% battery</span></div>
        <span class="sm" style="margin-top:8px">About 9 days left</span>
      </div>
    </div>
    <div class="btns">
      <button class="btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>Sync now</button>
      <button class="btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 9a7 7 0 0 1 0 6M19 9a7 7 0 0 1 0 6M9 7v10M15 7v10"/></svg>Find strap</button>
    </div>
    <div class="grp">
      <button class="r"><span class="k">Alarms</span><span class="v">06:40 weekdays</span></button>
      <button class="r"><span class="k">Phone alerts</span><span class="v">Calls and messages</span></button>
      <button class="r"><span class="k">Health alerts</span><span class="v">Heart rate over 140</span></button>
      <button class="r"><span class="k">Off-body reminder</span><span class="v">On</span></button>
      <button class="r"><span class="k">Auto-detect workouts</span><span class="v">On</span></button>
      <button class="r"><span class="k">Stay connected in background</span><span class="v">On</span></button>
      <button class="r"><span class="k">Firmware</span><span class="v">Up to date</span></button>
      <button class="r"><span class="k">Zepp account</span><span class="v">Signed in</span></button>
    </div>
    <div class="grp">
      <button class="r"><span class="k">Restart strap</span></button>
      <button class="r"><span class="k" style="color:#ff8a8d">Forget this strap</span></button>
    </div>
  </div>
  <div class="bar">
    <div class="tabs">
      <button class="tab on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>Today</button>
      <button class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21v-9"/><path d="M12 12c0-4 3-7 8-7 0 4-3 7-8 7z"/><path d="M12 14c0-3-2-5-7-5 0 3 2 5 7 5z"/></svg>Recovery</button>
      <button class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>Sleep</button>
      <button class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>Activity</button>
    </div>
    <button class="act" aria-label="All metrics"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1230}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
