# Work in progress on the wip branch: compile the app and run its unit tests, without building or publishing an APK.
# The log, any failing tests' reports and Room's schemas go to the ci-results-wip branch, readable with git alone.
name: WIP check

on:
  push:
    branches: [wip]

concurrency:
  group: wip-check
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;36.0.0" > /dev/null

      - name: Compile and test
        id: build
        run: |
          set -o pipefail
          ./gradlew :app:compileDebugKotlin 2>&1 | tee build.log
          OPENSTRAP_SHOTS=1 ./gradlew :app:testDebugUnitTest --continue 2>&1 | tee -a build.log

      - name: Publish results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.build.outcome }}
        run: |
          mkdir -p out/tests
          cp build.log out/ 2>/dev/null || true
          # Room's schemas as KSP wrote them, so a new database version's file can be committed from here.
          cp -r app/schemas out/ 2>/dev/null || true
          # Screens as ScreenshotsTest drew them.
          cp -r app/build/shots out/ 2>/dev/null || true
          grep -rl "<failure" --include="*.xml" . 2>/dev/null | grep test-results | xargs -r -I{} cp {} out/tests/ || true
          echo "$OUTCOME ${{ github.sha }}" > out/STATUS
          cd out
          git init -q -b ci-results-wip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Check of ${{ github.sha }}: $OUTCOME"
          git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-results-wip
