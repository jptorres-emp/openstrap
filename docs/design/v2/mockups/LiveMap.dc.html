<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Live workout, Map</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@700&amp;family=Outfit:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
.ph{width:390px;height:844px;background:#000;color:#fff;font-family:Outfit,system-ui,sans-serif;position:relative;overflow:hidden;box-sizing:border-box;padding:12px 16px 0;display:flex;flex-direction:column}
.dots{font-family:Doto,monospace;font-weight:700;line-height:.85;letter-spacing:.01em}
.top{display:flex;align-items:center;gap:10px;height:52px}
.ib{width:38px;height:38px;border-radius:50%;background:#1c1c1e;border:0;color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.sport{background:hsl(45 100% 70% / .18);color:hsl(45 100% 78%);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500}
.st{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:13px;color:#ffffffa6}
.dot{width:7px;height:7px;border-radius:50%;background:#3ddc97}
.map{position:relative;width:358px;height:400px;margin-top:8px;border-radius:40px;overflow:hidden;background:#0f1114;box-shadow:inset 0 0 0 1px #ffffff18}
.hr{position:absolute;left:14px;top:14px;display:flex;align-items:center;gap:8px;background:#000000c4;border:1px solid hsl(45 100% 62% / .6);box-shadow:0 0 18px hsl(45 100% 62% / .35);border-radius:999px;padding:8px 14px 8px 12px}
.hr b{font-family:Doto,monospace;font-size:26px;line-height:1}
.gps{position:absolute;right:14px;top:14px;background:#000000b0;border-radius:999px;padding:7px 12px;font-size:12.5px;color:#ffffffc0}
.sm{font-size:13px;color:#ffffffb8}
.pg{display:flex;gap:7px;justify-content:center;margin:14px 0 4px}
.pg i{width:7px;height:7px;border-radius:50%;background:#ffffff40}
.pg i.on{background:#fff}
.stats{display:flex;align-items:flex-end;margin-top:18px}
.stats>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.stats .rule{flex:0 0 1px;align-self:stretch;background:#ffffff1f}
.v{font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.ctl{display:flex;align-items:center;justify-content:space-between;margin:auto 12px 0;padding-bottom:10px}
.b1{width:64px;height:64px;border-radius:50%;border:0;background:#1c1c1e;color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.b2{width:88px;height:88px;border-radius:50%;border:0;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;padding:0}
.b3{width:64px;height:64px;border-radius:18px;border:2px solid #ffffff4d;background:#1c1c1e;color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.hint{text-align:center;font-size:12.5px;color:#ffffff8c;padding-bottom:22px}
</style>
</helmet>
<div class="ph">
  <div class="top">
    <button class="ib" aria-label="Minimise"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
    <span class="sport">Run</span>
    <span class="st"><span class="dot"></span>Strap</span>
  </div>
  <div class="map">
    <svg width="358" height="400" viewBox="0 0 358 400" aria-hidden="true">
      <g stroke="#ffffff10" stroke-width="10" fill="none" stroke-linecap="round"><path d="M-10 80 L380 120"/><path d="M60 -10 L90 420"/><path d="M-10 300 L380 260"/><path d="M250 -10 L210 420"/><path d="M-10 190 C100 170 200 210 380 180"/></g>
      <g stroke="#ffffff08" stroke-width="4" fill="none"><path d="M140 -10 L160 420"/><path d="M-10 360 L380 340"/><path d="M310 -10 L330 420"/></g>
      <path d="M70 330 C80 280 90 240 120 210 C150 180 200 190 230 170 C260 150 250 110 220 95" fill="none" stroke="#3ddc97" stroke-width="5" stroke-linecap="round"/>
      <path d="M220 95 C200 85 180 90 168 104" fill="none" stroke="#ffd166" stroke-width="5" stroke-linecap="round"/>
      <circle cx="168" cy="104" r="16" fill="#ffd166" fill-opacity=".25"/><circle cx="168" cy="104" r="7" fill="#fff" stroke="#ffd166" stroke-width="3"/>
    </svg>
    <div class="hr"><b>152</b><span class="sm" style="color:#fff">bpm, zone 3</span></div>
    <span class="gps">GPS good</span>
  </div>
  <div class="pg"><i></i><i class="on"></i></div>
  <div class="stats">
    <div><span class="sm">Distance</span><span class="v">3.10 km</span></div>
    <span class="rule"></span>
    <div style="flex:1.5"><span class="sm">Moving time</span><span class="v" style="font-size:40px;font-weight:400">18:42</span></div>
    <span class="rule"></span>
    <div><span class="sm">Pace</span><span class="v">5:58</span></div>
  </div>
  <div class="ctl">
    <button class="b1" aria-label="Lap"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg></button>
    <button class="b2" aria-label="Pause"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
    <button class="b3" aria-label="Hold to end"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
  </div>
  <div class="hint">Hold the square to end</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
