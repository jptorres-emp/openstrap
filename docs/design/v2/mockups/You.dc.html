<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>You sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
.ph{width:390px;height:844px;background:#000;color:#fff;font-family:Outfit,system-ui,sans-serif;position:relative;overflow:hidden}
.behind{position:absolute;inset:0;padding:20px 16px;opacity:.35;filter:blur(2px)}
.ghostcard{height:300px;border-radius:36px;background:linear-gradient(225deg,hsl(166 70% 40%),hsl(168 62% 12%) 45%)}
.sheet{position:absolute;left:0;right:0;bottom:0;top:58px;background:#0b0b0d;border-radius:32px 32px 0 0;border-top:1px solid #ffffff1c;padding:10px 16px 0;box-sizing:border-box;display:flex;flex-direction:column;gap:12px}
.grab{width:40px;height:5px;border-radius:3px;background:#ffffff33;align-self:center;margin-bottom:4px}
.head{display:flex;align-items:center;gap:14px;padding:6px 4px 4px}
.big{width:54px;height:54px;border-radius:50%;background:#1c1c1e;display:flex;align-items:center;justify-content:center}
.head h1{margin:0;font-size:22px;font-weight:500}
.sm{font-size:13px;color:#ffffff99}
.cap{font-size:13px;color:#ffffff80;margin:6px 6px -4px}
.grp{background:#141416;border:1px solid #ffffff10;border-radius:24px;padding:2px 18px}
.r{display:flex;align-items:center;gap:12px;padding:13px 0;border:0;border-bottom:1px solid #ffffff0d;background:none;width:100%;color:#fff;font-family:inherit;text-align:left}
.r:last-child{border-bottom:0}
.r .t{flex:1;display:flex;flex-direction:column;gap:2px}
.r .k{font-size:15px}
.close{position:absolute;right:16px;top:72px;width:34px;height:34px;border-radius:50%;border:0;background:#ffffff1a;color:#fff;display:flex;align-items:center;justify-content:center;padding:0;z-index:3}
.foot{font-size:12.5px;color:#ffffff66;text-align:center;margin-top:4px}
</style>
</helmet>
<div class="ph">
  <div class="behind"><div class="ghostcard"></div></div>
  <button class="close" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div class="sheet">
    <div class="grab"></div>
    <div class="head">
      <div class="big"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></div>
      <div><h1>You</h1><div class="sm">34, male, 72 kg, 178 cm</div></div>
    </div>
    <div class="grp">
      <button class="r"><span class="t"><span class="k">Profile</span><span class="sm">Age, body and usual activity</span></span></button>
      <button class="r"><span class="t"><span class="k">Goals</span><span class="sm">8,000 steps, 8 active hours</span></span></button>
      <button class="r"><span class="t"><span class="k">Sleep goal</span><span class="sm">7 h 30. Your sleep need is 8 h</span></span></button>
    </div>
    <div class="cap">Your data</div>
    <div class="grp">
      <button class="r"><span class="t"><span class="k">Save a copy</span><span class="sm">Last saved 3 Oct</span></span></button>
      <button class="r"><span class="t"><span class="k">Restore from a copy</span><span class="sm">For days before the strap's history</span></span></button>
      <button class="r"><span class="t"><span class="k">Health Connect</span><span class="sm">Last copy this morning</span></span></button>
    </div>
    <div class="grp">
      <button class="r"><span class="t"><span class="k">Diagnostics</span><span class="sm">For bug reports</span></span></button>
    </div>
    <div class="foot">OpenStrap 2.0. Everything stays on this phone.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
